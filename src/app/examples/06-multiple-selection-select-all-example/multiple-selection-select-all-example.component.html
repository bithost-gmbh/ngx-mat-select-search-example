
<h3>Multiple selection with Select All Checkbox</h3>
<p>
  <mat-form-field color="accent">
    <mat-select [formControl]="bankMultiCtrl" placeholder="Banks" [multiple]="true" #multiSelect>
      <mat-option>
        <ngx-mat-select-search [showToggleAllCheckbox]="true"
          [toggleAllCheckboxIndeterminate]="isIndeterminate"
          [toggleAllCheckboxChecked]="isChecked"
          (toggleAll)="toggleSelectAll($event)"
        [formControl]="bankMultiFilterCtrl"></ngx-mat-select-search>
      </mat-option>
      @for (bank of filteredBanksMulti | async; track bank) {
        <mat-option [value]="bank">
          {{bank.name}}
        </mat-option>
      }
    </mat-select>
  </mat-form-field>
</p>
<p>
  Selected Banks:
</p>
@for (bank of bankMultiCtrl?.value; track bank) {
  <ul>
    <li>{{bank.name}}</li>
  </ul>
}
